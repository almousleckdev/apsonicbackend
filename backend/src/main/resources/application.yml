spring:
  config:
    # Local convenience: load secrets from backend/.env (git-ignored). Real environment variables win in deployments.
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  application:
    name: apsonic-backend-cms

  # Servlet Multipart File Upload Configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB

  # Database & JPA Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:apsonic_cms}
    username: ${DB_USER:apsonic_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 100
      minimum-idle: 20
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # Flyway Database Migration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms

server:
  port: ${SERVER_PORT:8080}
  # Behind the Next.js proxy / Alibaba Cloud SLB the real client address arrives in X-Forwarded-For.
  # 'native' makes Tomcat honour it ONLY when the direct peer is a trusted (private-range) proxy, so
  # outside callers cannot spoof it. The backend must never be exposed to the internet directly.
  forward-headers-strategy: native
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024
  tomcat:
    threads:
      max: 400
      min-spare: 50
    max-swallow-size: 100MB
    max-http-form-post-size: 100MB
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# Actuator: only the health probe is exposed by default (load balancer / container checks).
# Richer endpoints are enabled in the local profile only.
management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true
    diskspace:
      enabled: true

# OpenAPI / Swagger documentation is off unless a profile enables it (see application-local.yml).
springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

# Custom Application Properties
app:
  rate-limit:
    enabled: true
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  security:
    public-api-docs: false
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
      issuer: ${JWT_ISSUER:apsonic-backend}
      audience: ${JWT_AUDIENCE:apsonic-web}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    cookie:
      name: refresh_token
      path: /api/v1/auth
      secure: ${COOKIE_SECURE:true}
      same-site: Strict
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,X-Requested-With
    allow-credentials: true
    max-age: 3600
