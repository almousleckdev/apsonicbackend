# Local Development Profile Overrides
spring:
  config:
    activate:
      on-profile: local

  flyway:
    # Local databases created before validation was enforced may carry edited migrations. Set both back to the
    # strict defaults (validate true / baseline false) once your local database has been recreated.
    validate-on-migrate: false
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  security:
    public-api-docs: true

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.apsonic.backend: ${LOGGING_LEVEL_APSONIC:DEBUG}
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
