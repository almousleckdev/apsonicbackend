services:
  postgres:
    image: postgres:16-alpine
    container_name: apsonic-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-apsonic_cms}
      POSTGRES_USER: ${DB_USER:-apsonic_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-apsonic_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-apsonic_user} -d ${DB_NAME:-apsonic_cms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - apsonic-network

  redis:
    image: redis:7-alpine
    container_name: apsonic-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-apsonic_redis_password_2026}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-apsonic_redis_password_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - apsonic-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: apsonic-pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@apsonic.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_secret_2026}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - apsonic-network

networks:
  apsonic-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
